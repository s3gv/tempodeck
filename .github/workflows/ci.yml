name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    name: Analyze & test
    # macOS, not Linux: parts of the suite touch the real audio engine, and
    # flutter_soloud ships no prebuilt library for Linux.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.4
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Drift, Riverpod and json_serializable outputs are gitignored.
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

  # Building the macOS app (and with it the Swift runner) would be the natural
  # next job, but `pod install` currently fails for macOS: ffmpeg_kit_audio_flutter
  # declares macOS support in its pubspec while shipping no macos/ directory,
  # so CocoaPods finds no podspec. See the notes in the pull request.
